<!doctype html>
<!-- mn-portal -->
<!-- 应用导航页（纯静态单文件，不参与 vite 构建，dirify 末步拷贝为 dist/index.html）。
     四台 PWA 各自 scope 在 /<app>/ 目录内，本页在根路径、不属于任何 PWA，仅作跳板；
     标记注释 `mn-portal` 是 dirify 幂等判据，勿删。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>应用导航 · C打卡工作台</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8; --card: #ffffff; --text: #1a2230; --muted: #64748b;
      --border: #e2e8f0; --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 8px 24px rgba(15, 23, 42, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1014; --card: #121a22; --text: #e6edf3; --muted: #8b98a9;
        --border: #1f2a35; --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    header p { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px; width: 100%; max-width: 560px;
    }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
    a.card {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 16px; text-decoration: none; color: var(--text);
      box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease;
      min-height: 84px;
    }
    a.card:hover, a.card:active { transform: translateY(-2px); border-color: var(--accent); }
    .badge {
      flex: none; width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff;
    }
    .badge svg { width: 24px; height: 24px; fill: currentColor; }
    .meta { min-width: 0; }
    .meta .name { font-size: 16px; font-weight: 600; }
    .meta .desc { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }
    footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <header>
    <h1>应用导航</h1>
    <p>四个独立工作台，可分别安装为 PWA</p>
  </header>
  <nav class="grid" aria-label="应用入口">
    <a class="card" href="./workbench/" style="--accent:#2563eb">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 0 1 1 1v1h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3V3a1 1 0 0 1 1-1zm1 3h4V4h-4v1zM6 10v2h2v-2H6zm5 0v2h2v-2h-2zm5 0v2h2v-2h-2zM6 14v2h2v-2H6zm5 0v2h2v-2h-2zm5 0v2h2v-2h-2z"/></svg>
      </span>
      <span class="meta">
        <span class="name">我的C打卡</span>
        <span class="desc">主工作台 · 任务与日常打卡</span>
      </span>
    </a>
    <a class="card" href="./auto/" style="--accent:#10b981">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm4.2 7.2-5.6 5.6a1 1 0 0 1-1.4 0L7 12.6l1.4-1.4 1.5 1.5 4.9-4.9 1.4 1.4z"/></svg>
      </span>
      <span class="meta">
        <span class="name">自动化测试分析</span>
        <span class="desc">独立工作台 · 轮次与用例分析</span>
      </span>
    </a>
    <a class="card" href="./perf/" style="--accent:#0d9488">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-7.9 16.1l1.5-1.3A8 8 0 1 1 12 20v2a10 10 0 0 0 0-20zm4.7 5.3-4.6 5-2.6-2.1-1.2 1.5 3.3 2.7a1 1 0 0 0 1.4-.1l5.2-5.7-1.5-1.3z"/></svg>
      </span>
      <span class="meta">
        <span class="name">性能测试观测台</span>
        <span class="desc">独立工作台 · 采集点与趋势</span>
      </span>
    </a>
    <a class="card" href="./marknote/" style="--accent:#6366f1">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM7 12h10v1.6H7V12zm0 4h10v1.6H7V16z"/></svg>
      </span>
      <span class="meta">
        <span class="name">MarkNote</span>
        <span class="desc">个人笔记本 · 笔记与知识库</span>
      </span>
    </a>
  </nav>
  <footer>跳转后可在各应用内「安装到桌面」</footer>
  <script>
    // 注册根 SW：导航页随之离线可用（SW 在根 scope，四台共用，重复注册会被浏览器去重）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}) })
    }
  </script>
</body>
</html>
