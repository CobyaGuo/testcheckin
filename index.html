<!doctype html>
<!-- mn-portal -->
<!-- 应用导航页（纯静态单文件，不参与 vite 构建，dirify 末步拷贝为 dist/index.html）。
     四台 PWA 各自 scope 在 /<app>/ 目录内，本页在根路径、不属于任何 PWA，仅作跳板；
     标记注释 `mn-portal` 是 dirify 幂等判据，勿删。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>应用导航 · C打卡工作台</title>
  <script>
    /* rev7.7：终端控制台皮肤为默认（避免首屏闪烁）；显式「退出终端皮肤」后持久化为 default。 */
    try { if (localStorage.getItem('portal-theme-mode') !== 'default') document.documentElement.dataset.mode = 'console' } catch (e) { document.documentElement.dataset.mode = 'console' }
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8; --card: #ffffff; --text: #1a2230; --muted: #64748b;
      --border: #e2e8f0; --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 8px 24px rgba(15, 23, 42, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1014; --card: #121a22; --text: #e6edf3; --muted: #8b98a9;
        --border: #1f2a35; --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    header p { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px; width: 100%; max-width: 560px;
    }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
    a.card {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 16px; text-decoration: none; color: var(--text);
      box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease;
      min-height: 84px;
    }
    a.card:hover, a.card:active { transform: translateY(-2px); border-color: var(--accent); }
    .badge {
      flex: none; width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff;
    }
    .badge svg { width: 24px; height: 24px; fill: currentColor; }
    .meta { min-width: 0; }
    .meta .name { font-size: 16px; font-weight: 600; }
    .meta .desc { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }
    footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
    [hidden] { display: none !important; }

    /* ===== rev7.6 终端控制台皮肤（demo 移植）：独立切换开关持久化 portal-theme-mode ===== */
    html[data-mode="console"] {
      color-scheme: dark;
      --bg: #050b14; --card: #0d1a2b; --text: #d7e9f5; --muted: #6d87a0;
      --border: rgba(64, 154, 190, .22);
      --shadow: 0 2px 10px rgba(0, 0, 0, .35), 0 8px 30px rgba(0, 0, 0, .4);
    }
    html[data-mode="console"] body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 100% 90% at 50% 0%, #000 20%, transparent 100%);
      mask-image: radial-gradient(ellipse 100% 90% at 50% 0%, #000 20%, transparent 100%);
    }
    html[data-mode="console"] body::after {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .3;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, .14) 3px 4px);
    }
    html[data-mode="console"] header,
    html[data-mode="console"] nav,
    html[data-mode="console"] footer { position: relative; z-index: 1; }
    html[data-mode="console"] a.card { border-radius: 14px; }
    html[data-mode="console"] footer { font-family: ui-monospace, Consolas, monospace; letter-spacing: .5px; }
    .mode-toggle {
      position: fixed; top: 14px; right: 16px; z-index: 5;
      display: inline-flex; align-items: center; gap: 7px;
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font: 11px/1 ui-monospace, Consolas, monospace; padding: 7px 12px;
      border-radius: 8px; cursor: pointer; transition: border-color .2s, color .2s;
    }
    .mode-toggle:hover { border-color: #2de2ff; color: #2de2ff; }
    .mode-toggle.on { border-color: rgba(45, 226, 255, .45); color: #2de2ff; }
    .mode-toggle svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header>
    <h1>应用导航</h1>
    <p>四个独立工作台，可分别安装为 PWA</p>
  </header>
  <nav class="grid" aria-label="应用入口">
    <a class="card" href="./workbench/" style="--accent:#2563eb">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 0 1 1 1v1h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3V3a1 1 0 0 1 1-1zm1 3h4V4h-4v1zM6 10v2h2v-2H6zm5 0v2h2v-2h-2zm5 0v2h2v-2h-2zM6 14v2h2v-2H6zm5 0v2h2v-2h-2zm5 0v2h2v-2h-2z"/></svg>
      </span>
      <span class="meta">
        <span class="name">我的C打卡</span>
        <span class="desc">主工作台 · 任务与日常打卡</span>
      </span>
    </a>
    <a class="card" href="./auto/" style="--accent:#10b981">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm4.2 7.2-5.6 5.6a1 1 0 0 1-1.4 0L7 12.6l1.4-1.4 1.5 1.5 4.9-4.9 1.4 1.4z"/></svg>
      </span>
      <span class="meta">
        <span class="name">自动化测试分析</span>
        <span class="desc">独立工作台 · 轮次与用例分析</span>
      </span>
    </a>
    <a class="card" href="./perf/" style="--accent:#0d9488">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-7.9 16.1l1.5-1.3A8 8 0 1 1 12 20v2a10 10 0 0 0 0-20zm4.7 5.3-4.6 5-2.6-2.1-1.2 1.5 3.3 2.7a1 1 0 0 0 1.4-.1l5.2-5.7-1.5-1.3z"/></svg>
      </span>
      <span class="meta">
        <span class="name">性能测试观测台</span>
        <span class="desc">独立工作台 · 采集点与趋势</span>
      </span>
    </a>
    <a class="card" href="./marknote/" style="--accent:#6366f1">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM7 12h10v1.6H7V12zm0 4h10v1.6H7V16z"/></svg>
      </span>
      <span class="meta">
        <span class="name">MarkNote</span>
        <span class="desc">个人笔记本 · 笔记与知识库</span>
      </span>
    </a>
    <a class="card" id="card-users" href="./login/index.html?view=users" style="--accent:#b45309" hidden>
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5zm7-9v2h2v2h-2v2h-2V9h-2V7h2V5h2z"/></svg>
      </span>
      <span class="meta">
        <span class="name">用户权限管理</span>
        <span class="desc">L3 专属 · 账号 / 角色 / 应用访问权</span>
      </span>
    </a>
    <a class="card" href="./login/index.html" style="--accent:#64748b">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M11 7h2v6h-2V7zm1 9.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zM12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
      </span>
      <span class="meta">
        <span class="name">账号登录</span>
        <span class="desc">角色 L1/L2/L3 · 记住登录</span>
      </span>
    </a>
  </nav>
  <footer>跳转后可在各应用内「安装到桌面」</footer>
  <button class="mode-toggle" id="mode-toggle" type="button" aria-pressed="false" title="切换终端控制台皮肤">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>
    <span id="mode-label">终端皮肤</span>
  </button>
  <script>
    // 有登录会话时按实时身份过滤 auto/perf 卡片，并给 L3 显示用户管理入口。
    // 无会话保持全显示（本机沙箱可用；进入 Node 模式的应用会自行踢登录）。
    (function () {
      var session = null
      try { session = JSON.parse(localStorage.getItem('checkin-auth-session') || 'null') } catch (e) {}
      if (!session) return
      fetch('./api/auth/whoami', { credentials: 'same-origin', cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null })
        .then(function (body) {
          var user = body && body.user
          if (!user) return
          ;['auto', 'perf'].forEach(function (app) {
            var card = document.querySelector('a.card[href="./' + app + '/"]')
            if (card && (!user.apps || user.apps.indexOf(app) < 0)) card.hidden = true
          })
          if (user.role === 'L3') {
            var usersCard = document.getElementById('card-users')
            if (usersCard) usersCard.hidden = false
          }
        })
        .catch(function () {})

      // 注册根 SW：导航页随之离线可用（SW 在根 scope，四台共用，重复注册会被浏览器去重）
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}) })
      }
    })()
  </script>
  <script>
    /* rev7.6：终端控制台皮肤独立切换开关（与 perf/auto 的 data-mode=console 同一套视觉）。 */
    (function () {
      var btn = document.getElementById('mode-toggle')
      var label = document.getElementById('mode-label')
      function sync() {
        var on = document.documentElement.dataset.mode === 'console'
        btn.classList.toggle('on', on)
        btn.setAttribute('aria-pressed', on ? 'true' : 'false')
        label.textContent = on ? '退出终端皮肤' : '终端皮肤'
      }
      btn.addEventListener('click', function () {
        var on = document.documentElement.dataset.mode === 'console'
        if (on) {
          delete document.documentElement.dataset.mode
          try { localStorage.setItem('portal-theme-mode', 'default') } catch (e) {}
        } else {
          document.documentElement.dataset.mode = 'console'
          try { localStorage.setItem('portal-theme-mode', 'console') } catch (e) {}
        }
        sync()
      })
      sync()
    })()
  </script>
</body>
</html>
